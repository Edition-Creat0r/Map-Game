<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#06101a" />
  <meta name="description" content="Map Game — build cities, command territory, and grow a civilization." />

  <title>Map Game</title>

  <!-- UI / shell -->
  <link rel="stylesheet" href="styles.css?v=1117" />

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="auth.js?v=1117" defer></script>
  <script src="multiplayer.js?v=1117" defer></script>

  <!-- Babylon -->
  <script src="https://cdn.babylonjs.com/babylon.js" defer></script>

  <!-- Core game -->
  <script src="game.js?v=1117" defer></script>

  <!-- Presentation / world systems -->
  <script src="ui.js?v=1117" defer></script>
  <script src="materials.js?v=1117" defer></script>
  <script src="terrain.js?v=1117" defer></script>
  <script src="buildings.js?v=1117" defer></script>
  <script src="world_visuals.js?v=1117" defer></script>

  <!-- Final visual pass: keep LAST -->
  <script src="visual_overhaul.js?v=1117" defer></script>
</head>

<body>
  <!-- Static atmosphere behind the 3D canvas and menus. -->
  <div id="backgroundGlow" aria-hidden="true"></div>
  <div id="shellGrid" aria-hidden="true"></div>
  <div id="shellVignette" aria-hidden="true"></div>

  <div id="loadingScreen" role="status" aria-live="polite" aria-label="Loading Map Game">
    <div class="loading-card">
      <div class="loading-brand-row">
        <div class="loading-logo" aria-hidden="true">M</div>
        <div class="loading-brand-copy">
          <div class="loading-kicker">NOVA COMMAND NETWORK</div>
          <div class="loading-title">MAP GAME</div>
        </div>
      </div>

      <div class="loading-rule"></div>

      <div class="loading-subtitle">
        Preparing terrain, cities, and civilization systems…
      </div>

      <div class="loading-line" aria-hidden="true">
        <span></span>
      </div>

      <div class="loading-meta">
        <span>ALPHA 0.1.1</span>
        <span class="loading-meta-dot"></span>
        <span>VISUAL WORLD PASS</span>
      </div>
    </div>
  </div>

  <canvas
    id="gameCanvas"
    tabindex="0"
    aria-label="Map Game 3D civilization world">
  </canvas>

  <noscript>
    <div class="noscript-card">
      Map Game requires JavaScript to run.
    </div>
  </noscript>
</body>
</html>
